# Reemplaza estos dos valores con los que muestra SonarQube Cloud al crear el proyecto.
sonar.organization=jcg097
sonar.projectKey=JCG097_prueba-autoservicio

sonar.projectName=prueba-autoservicio

# Qué es código de la app y qué son pruebas.
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Reporte de cobertura generado por Jest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=app/src/server.js,app/public/**

# Espera el resultado del Quality Gate: si no se aprueba, el job falla.
sonar.qualitygate.wait=true
