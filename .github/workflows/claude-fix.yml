name: Claude Fix

# Cuando el pipeline de calidad falla en un PR de Claude, reporta el error en el PR
# y le pide a Claude que lo corrija. Máximo 3 intentos; luego escala a una persona.
on:
  workflow_run:
    workflows: ["Quality Pipeline"]
    types: [completed]

jobs:
  fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      MAX_INTENTOS: 3
      CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
    steps:
      - name: Identificar el PR y el número de intento
        id: contexto
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then echo "No hay PR abierto para $BRANCH"; exit 1; fi
          PREVIOS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name | select(startswith("claude-attempt-"))] | length')
          INTENTO=$((PREVIOS + 1))
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "intento=$INTENTO" >> "$GITHUB_OUTPUT"
          echo "PR #$PR, intento $INTENTO de $MAX_INTENTOS"

      - name: Construir el reporte del fallo
        run: |
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          FALLIDOS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | select(.conclusion=="failure") | "- " + .name')
          gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' > /tmp/fallidos.txt
          LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed | sed 's/\x1b\[[0-9;]*m//g' | tail -n 150)
          {
            echo "## Reporte de quality gates: intento ${{ steps.contexto.outputs.intento }} de $MAX_INTENTOS"
            echo ""
            echo "**Gates fallidos:**"
            echo "$FALLIDOS"
            echo ""
            echo "**Ejecución:** $RUN_URL"
            echo ""
            echo "<details><summary>Log del error (últimas 150 líneas)</summary>"
            echo ""
            echo '```text'
            echo "$LOG"
            echo '```'
            echo "</details>"
          } > /tmp/reporte-fallo.md
          cat /tmp/reporte-fallo.md

      - name: Publicar el reporte en el PR
        run: |
          gh label create "claude-attempt-${{ steps.contexto.outputs.intento }}" --repo "$REPO" --color FBCA04 --force
          gh pr comment "${{ steps.contexto.outputs.pr }}" --repo "$REPO" --body-file /tmp/reporte-fallo.md
          gh pr edit "${{ steps.contexto.outputs.pr }}" --repo "$REPO" --add-label "claude-attempt-${{ steps.contexto.outputs.intento }}"

      - name: Notificar que la IA está corrigiendo
        if: steps.contexto.outputs.intento <= 3 && env.CHAT_WEBHOOK_URL != ''
        run: |
          PR_URL="https://github.com/$REPO/pull/${{ steps.contexto.outputs.pr }}"
          TEXT=$(printf '🤖 *La IA está corrigiendo un fallo*\nPR: <%s|#%s>\nIntento %s de %s\nGates fallidos: %s' \
            "$PR_URL" "${{ steps.contexto.outputs.pr }}" "${{ steps.contexto.outputs.intento }}" "$MAX_INTENTOS" "$(cat /tmp/fallidos.txt)")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json; charset=UTF-8' --data @- "$CHAT_WEBHOOK_URL"

      - name: Escalar a revisión humana
        if: steps.contexto.outputs.intento > 3
        run: |
          PR="${{ steps.contexto.outputs.pr }}"
          gh label create needs-human --repo "$REPO" --color D93F0B --force
          gh pr edit "$PR" --repo "$REPO" --add-label needs-human
          gh issue create --repo "$REPO" --label needs-human \
            --title "Revisión humana requerida: PR #$PR" \
            --body "Claude agotó $MAX_INTENTOS intentos de corrección en el PR #$PR. Revisa los reportes publicados en el PR."
          if [ -n "$CHAT_WEBHOOK_URL" ]; then
            TEXT=$(printf '🚨 *Revisión humana requerida*\nLa IA agotó %s intentos de corrección en el PR <%s|#%s>.\nGates fallidos: %s' \
              "$MAX_INTENTOS" "https://github.com/$REPO/pull/$PR" "$PR" "$(cat /tmp/fallidos.txt)")
            jq -n --arg text "$TEXT" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-Type: application/json; charset=UTF-8' --data @- "$CHAT_WEBHOOK_URL"
          fi

      - uses: actions/checkout@v5
        if: steps.contexto.outputs.intento <= 3
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.contexto.outputs.intento <= 3
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.contexto.outputs.intento <= 3

      - name: Claude corrige el fallo
        if: steps.contexto.outputs.intento <= 3
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude[bot]"
          prompt: |
            El pipeline de calidad falló en el PR #${{ steps.contexto.outputs.pr }} (rama ${{ env.BRANCH }}) del repositorio ${{ env.REPO }}.
            Este es el intento ${{ steps.contexto.outputs.intento }} de ${{ env.MAX_INTENTOS }}.

            Lee el reporte ejecutando: cat /tmp/reporte-fallo.md
            Luego encuentra la causa raíz y corrígela siguiendo estrictamente CLAUDE.md.
            - Tienes el rol DESARROLLO de CLAUDE.md: solo puedes modificar app/ y tests/unit/.
            - Las pruebas de tests/acceptance/ y tests/e2e/ son la especificación: nunca las modifiques. Si fallan, corrige el código. Si crees que una prueba de aceptación es incorrecta, no la cambies: explícalo en el comentario del PR para revisión humana.
            - Si falló el gate de TDD, agrega o actualiza las pruebas unitarias que faltan.
            - Nunca bajes umbrales, borres pruebas, uses .skip/.only ni modifiques archivos prohibidos para pasar un gate.
            - Verifica con npm run lint y npm run test:coverage antes de hacer commit.

            Cuando esté corregido, haz un commit fix(#${{ steps.contexto.outputs.pr }}): <causa corregida> y git push a la rama ${{ env.BRANCH }}.
            Al final, comenta en el PR con gh pr comment explicando en 2 o 3 líneas qué falló y qué corregiste.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit(app/**),Write(app/**),Edit(tests/unit/**),Write(tests/unit/**),Bash(npm test),Bash(npm test:*),Bash(npm run lint),Bash(npm run test:coverage),Bash(npx jest:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr comment:*),Bash(cat /tmp/reporte-fallo.md)"
